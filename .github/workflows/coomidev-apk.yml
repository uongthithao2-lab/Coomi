# CoomiDev APK — GitHub Actions 云端构建
#
# 用途：在用户 fork 中通过 workflow_dispatch 手动触发，以 COOMI_DEV_BUILD=1
# 构建隔离的 CoomiDev 预览 APK（包名 com.coomidev.android、应用名 CoomiDev、
# 默认端口 18765、图标 assets/coomi-agent-dev.png），校验后上传 artifact。
#
# 约束（与 tools/mobile-build 和 coomi-custom-iteration Skill 保持一致）：
#   - 固定 ubuntu-24.04 runner 与 JDK/Node/Rust/Android 构建版本
#   - 构建前先跑前端类型检查与最小相关 Rust 测试
#   - 签名材料只来自 GitHub Encrypted Secrets，缺失时构建失败，绝不明文回退
#   - 运行时资产从官方 Release 固定 tag 下载并按仓库内 manifest 校验 SHA-256
#   - 不向官方仓库 main 推送；发布/PR 走用户显式确认的独立流程

name: CoomiDev APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要构建的分支/ref（默认使用触发运行的分支）
        required: false
        type: string
      version_suffix:
        description: APK versionName（必须符合 semver，例如 1.4.4-coomidev.1）
        required: false
        type: string
        default: "1.4.4-coomidev.1"
      upload_apk:
        description: 构建并校验通过后上传 APK artifact
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  coomidev-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Rust 1.95.0 + Android target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt
          targets: aarch64-linux-android

      - name: Set up Android SDK (compileSdk 36, NDK 27, build-tools 36)
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973"
          accept-licenses: true

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ hashFiles('apps/coomi-rs/Cargo.lock') }}
          restore-keys: |
            cargo-

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Frontend type check
        working-directory: apps/web
        run: npm run type-check

      - name: Smallest relevant Rust tests (coomi-security)
        working-directory: apps/coomi-rs
        run: cargo test --locked -p coomi-security --lib

      - name: Stage pinned Runtime V2 assets (verified against committed manifest)
        run: |
          set -euo pipefail
          MANIFEST="apps/coomi-app/app/src/main/assets/runtime-v2-manifest.json"
          mkdir -p runtime-v2-dist
          python3 - "$MANIFEST" <<'PY'
          import json, hashlib, os, sys, urllib.request

          manifest = json.load(open(sys.argv[1]))
          outdir = "runtime-v2-dist"
          for key, fname in (("host", "proot-host-arm64.tar.gz"), ("rootfs", "debian-bookworm-arm64.tar.gz")):
              entry = manifest[key]
              dest = os.path.join(outdir, fname)
              if os.path.exists(dest) and os.path.getsize(dest) == entry["size"]:
                  print(f"[skip] {fname} already present")
                  continue
              print(f"[download] {entry['url']}")
              urllib.request.urlretrieve(entry["url"], dest)
              sha = hashlib.sha256(open(dest, "rb").read()).hexdigest()
              assert sha == entry["sha256"], f"SHA-256 mismatch for {fname}: {sha}"
              print(f"[ok] {fname} verified ({os.path.getsize(dest)} bytes)")
          PY

      - name: Inject preview signing key (from encrypted secrets)
        env:
          KEYSTORE_B64: ${{ secrets.COOMI_PREVIEW_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.COOMI_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing signing secrets: set COOMI_PREVIEW_KEYSTORE_B64 and COOMI_PREVIEW_KEYSTORE_PASSWORD in the fork." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > apps/coomi-app/app/testkey_untrusted.jks
          test -s apps/coomi-app/app/testkey_untrusted.jks
          printf 'coomi.signing.storePassword=%s\ncoomi.signing.keyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > local.properties
          chmod 600 local.properties
          echo "[ok] preview signing key staged (never printed)"

      - name: Build CoomiDev release APK
        env:
          COOMI_DEV_BUILD: "1"
          TERMUX_APP_VERSION_NAME: ${{ inputs.version_suffix }}
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleRelease

      - name: Verify APK identity and signature
        run: |
          set -euo pipefail
          APK=$(find apps/coomi-app/app/build/outputs/apk/release -type f -name 'CoomiDev-*.apk' | sort | tail -n 1)
          test -n "$APK" && test -s "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "APK_FILE=$(basename "$APK")" >> "$GITHUB_ENV"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort | tail -n 1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n 1)
          BADGING=$("$AAPT2" dump badging "$APK")
          echo "$BADGING" | grep "package: name='com.coomidev.android'" >/dev/null
          echo "$BADGING" | grep "application-label:'CoomiDev'" >/dev/null
          echo "$BADGING" | grep "native-code: 'arm64-v8a'" >/dev/null
          "$APKSIGNER" verify --verbose "$APK" | head -n 3
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload CoomiDev APK artifact
        if: ${{ inputs.upload_apk }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coomidev-apk
          path: |
            apps/coomi-app/app/build/outputs/apk/release/CoomiDev-*.apk
            apps/coomi-app/app/build/outputs/apk/release/CoomiDev-*.apk.sha256
          if-no-files-found: error
